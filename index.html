    <!-- Tailwind via CDN to ensure styles match exactly without build config drift -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              escriturando: {
                gold: '#F5A623',
                goldHover: '#FBBE4B',
                goldDark: '#D98208',
                goldLight: '#FDE4A3',
                goldMuted: 'rgba(245, 166, 35, 0.15)',
                dark: '#0D0E12',
                darker: '#07080A',
                surface: '#16171E',
                surfaceLight: '#21232B',
                border: '#282A36',
              },
              op7: {
                primaryStart: '#F5A623',
                primaryEnd: '#D98208',
                secondaryStart: '#E08A00',
                secondaryEnd: '#F5A623',
                dark: '#0D0E12',
                surface: '#16171E',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.6s ease-out forwards',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
